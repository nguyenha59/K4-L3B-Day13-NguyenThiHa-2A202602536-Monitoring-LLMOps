# Ba alert symptom-based, nguồn dữ liệu: data/logs.jsonl (cùng logic với config/dashboard.yaml).
# Mỗi alert gắn với một triệu chứng người dùng cảm nhận được, không dựa vào tên implementation.
alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602536
    slo: fast_successful_requests (latency_ms <= 3000)
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRateOrRetrievalFailing
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 OR tool_success_rate_pct(retrieval) < 90'
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602536
    slo: fast_successful_requests; guardrails error_rate_pct_max=2, retrieval_success_rate_pct_min=90
    runbook: docs/alerts.md#alert-2

  - name: CostPerRequestSpike
    severity: warning
    condition: 'avg(response_sent.cost_usd) > 0.005 OR projected_daily_cost_usd > 2.5'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602536
    slo: guardrail daily_cost_usd_max=2.5
    runbook: docs/alerts.md#alert-3
