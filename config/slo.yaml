service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  # Lý do giữ ngưỡng 3000 ms: baseline latency_ms (đo trong agent) khoảng 150-152 ms cả
  # khi chạy tuần tự lẫn concurrency 5, nên 3000 ms là ngưỡng rộng (gần 20 lần baseline) cho
  # SLO dài hạn 28 ngày. Hạn chế đã biết: retrieval chậm khoảng 2.5 s cho latency_ms khoảng 2650 ms,
  # vẫn dưới 3000 ms; ngưỡng 3000 ms không bắt được suy giảm ở mức này.
  error_budget_calculation: >
    Error budget = 100% - 99.5% = 0.5% số request trong cửa sổ 28 ngày.
    Ví dụ 10,000 request/28 ngày thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000 ms.
    Burn rate = tỷ lệ request xấu / 0.5%. Ví dụ 10% request xấu nghĩa là burn rate 20, và budget
    28 ngày cạn sau khoảng 1.4 ngày (28 / 20). Đây là lý do alert latency và error đặt duration ngắn (3–5 phút).
  note: Ngưỡng được kiểm chứng bằng baseline trong submission/evidence/00-baseline-*.txt và dashboard runtime.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
